apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    app: prometheus
data:
  rules.yml: |
    groups:
    - name: microservices
      interval: 30s
      rules:
      # Alerta 1: Alta tasa de error en microservicios (basada en métricas OpenTelemetry)
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(otel_http_requests_total{http_status_code=~"5.."}[5m])) by (exported_job, endpoint)
            /
            sum(rate(otel_http_requests_total[5m])) by (exported_job, endpoint)
          ) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alta tasa de error detectada en {{ $labels.exported_job }}"
          description: "La tasa de error es {{ $value }} para el servicio {{ $labels.exported_job }} en el endpoint {{ $labels.endpoint }}"
          runbook_url: "http://localhost:3000/d/observability-overview"
      
      # Alerta 2: Alta latencia en microservicios (basada en métricas OpenTelemetry)
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, 
            sum(rate(otel_http_request_duration_seconds_bucket[5m])) by (exported_job, endpoint, le)
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia detectada en {{ $labels.exported_job }}"
          description: "El percentil 95 de latencia es {{ $value }}s para el servicio {{ $labels.exported_job }} en el endpoint {{ $labels.endpoint }}"
          runbook_url: "http://localhost:3000/d/observability-overview"
      
      # Alerta 3: OpenTelemetry Collector caído
      - alert: OpenTelemetryCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenTelemetry Collector está caído"
          description: "El collector de OpenTelemetry no está respondiendo desde hace más de 1 minuto"
      
      # Alerta 4: Sin métricas de microservicios
      - alert: NoMicroserviceMetrics
        expr: |
          absent(otel_http_requests_total{exported_job=~"micro-.*|api-gateway"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No se están recibiendo métricas de microservicios"
          description: "No se han recibido métricas de los microservicios en los últimos 5 minutos"
      
      - alert: ServiceDown
        expr: up{job=~"micro.*|api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Service {{ $labels.job }} is down"
      
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% for pod {{ $labels.pod }}"
      
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }} for pod {{ $labels.pod }}"
      
      - alert: LowRequestRate
        expr: rate(http_requests_total[5m]) < 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low request rate"
          description: "Request rate is {{ $value }} requests/sec for service {{ $labels.service }}"
