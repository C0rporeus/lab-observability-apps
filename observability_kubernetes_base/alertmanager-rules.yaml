apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-rules
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@lab-observability.local'
      resolve_timeout: 5m
    
    # Templates para personalizar las alertas
    templates:
      - '/etc/alertmanager/templates/*.tmpl'
    
    # Rutas de alertas
    route:
      receiver: 'default-receiver'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      routes:
      # Alertas críticas - alta prioridad
      - match:
          severity: critical
        receiver: 'critical-alerts'
        continue: false
      
      # Alertas de microservicios
      - match:
          service: micro-1
        receiver: 'microservices-alerts'
        group_wait: 5s
        group_interval: 30s
        repeat_interval: 1h
      
      - match:
          service: micro-2
        receiver: 'microservices-alerts'
        group_wait: 5s
        group_interval: 30s
        repeat_interval: 1h
      
      - match:
          service: api-gateway
        receiver: 'api-gateway-alerts'
        group_wait: 5s
        group_interval: 30s
        repeat_interval: 1h
      
      # Alertas de observabilidad
      - match:
          service: otel-collector
        receiver: 'observability-alerts'
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 2h
    
    # Receivers (destinos de las alertas)
    receivers:
    - name: 'default-receiver'
      webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
    
    - name: 'critical-alerts'
      webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'admin'
            password: 'admin'
      # Aquí puedes agregar más canales: email, slack, pagerduty, etc.
      # email_configs:
      # - to: 'oncall@example.com'
      #   from: 'alertmanager@lab-observability.local'
      #   smarthost: 'smtp.example.com:587'
      #   auth_username: 'alertmanager'
      #   auth_password: 'password'
    
    - name: 'microservices-alerts'
      webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
    
    - name: 'api-gateway-alerts'
      webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
    
    - name: 'observability-alerts'
      webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
    
    # Inhibición de alertas (evitar spam)
    inhibit_rules:
    # Si un servicio está caído, no alertar por alta latencia o tasa de error
    - source_match:
        severity: 'critical'
        alertname: 'ServiceDown'
      target_match:
        severity: 'warning'
      equal: ['service', 'cluster']
    
    # Si el collector está caído, inhibir alertas de métricas
    - source_match:
        alertname: 'OpenTelemetryCollectorDown'
      target_match_re:
        alertname: '.*'
      equal: ['cluster']

