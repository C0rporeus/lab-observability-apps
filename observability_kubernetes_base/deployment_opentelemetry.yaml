apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  labels:
    app: opentelemetry-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      batch:
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_mib: 1000
      resource:
        attributes:
          - key: service.name
            from_attribute: service.name
            action: upsert
          - key: app
            from_attribute: service.name
            action: upsert

    exporters:
      debug:
        verbosity: detailed
      otlp/jaeger:
        endpoint: "http://jaeger:4317"
        tls:
          insecure: true
      otlphttp:
        endpoint: "http://loki:3100/otlp"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"
        send_timestamps: true
        enable_open_metrics: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, resource]
          exporters: [otlp/jaeger, debug]
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter, resource]
          exporters: [otlphttp, debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, memory_limiter, resource]
          exporters: [prometheus, debug] 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: opentelemetry-collector
  annotations:
    linkerd.io/inject: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-collector
  template:
    metadata:
      labels:
        app: opentelemetry-collector
      annotations:
        # Configurar Linkerd para que no intercepte el tráfico a Jaeger y Loki (gRPC y HTTP)
        config.linkerd.io/skip-outbound-ports: "4317,4318,16686,3100"
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        args:
        - --config=/conf/collector.yaml
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: otel-collector-config-vol
          mountPath: /conf
        ports:
        - containerPort: 4317
          name: grpc
        - containerPort: 4318
          name: http
        - containerPort: 8888
          name: metrics
        - containerPort: 8889
          name: prometheus
      volumes:
      - name: otel-collector-config-vol
        configMap:
          name: otel-collector-conf
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: opentelemetry-collector
spec:
  ports:
  - port: 4317
    name: grpc
    targetPort: grpc
  - port: 4318
    name: http
    targetPort: http
  - port: 8888
    name: metrics
    targetPort: metrics
  - port: 8889
    name: prometheus
    targetPort: prometheus
  selector:
    app: opentelemetry-collector
